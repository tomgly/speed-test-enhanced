name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal web.go)"
      - run: go test -short ./...
      - run: go vet ./...
      - run: go build -o speedtest.exe ./cmd/speedtest
        if: runner.os == 'Windows'
      - run: go build -o speedtest ./cmd/speedtest
        if: runner.os != 'Windows'
      - run: node --test --test-skip-pattern="production .* start" tests/*.test.cjs
